version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eletrodescarte-db
    environment:
      POSTGRES_DB: eletrodescarte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
