spring:
  application:
    name: eletrodescarte
  datasource:
    url: jdbc:postgresql://localhost:5450/eletrodescarte
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
